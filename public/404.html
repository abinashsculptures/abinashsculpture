<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Abinash Sculptures</title>
    <script>
      // SPA fallback: preserve the path/query/hash and redirect to index.html
      (function () {
        var l = window.location;
        var redirect =
          l.pathname.replace(/^\/+/, '/') +
          (l.search ? '?' + l.search.slice(1) : '') +
          l.hash;
        sessionStorage.setItem('spa-redirect', redirect);
        l.replace('/');
      })();
    </script>
  </head>
  <body></body>
</html>
